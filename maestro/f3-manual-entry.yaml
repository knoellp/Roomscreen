# Phase F3: manual host/port entry on the device (run green on 2026-10-18).
# Start state (set by scripts/f3-manual-entry.sh): the saved Core address points at an unused address, so the app shows the
# Connecting screen with the "Enter address manually" button. The real Core host comes in as CORE_HOST, read from the app's own
# DUMP_STATE before the test (never a constant):
#   maestro test -e CORE_HOST=<host from DUMP_STATE> -e ROON_TEST_ZONE=<zone> maestro/f3-manual-entry.yaml
# Works for the English and the German UI. The port stays at its default (9330).
appId: io.github.knoellp.roomscreen
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "(Enter address manually|Adresse manuell eingeben)"
    timeout: 30000
# The buttons only react to the remote (Dpad), not to touch: the first Center focuses the button when it has no focus yet,
# the second one presses it. Pressing again is harmless once the entry screen is open (it is skipped then).
- pressKey: Remote Dpad Center
- runFlow:
    when:
      notVisible: "(Connect manually|Manuell verbinden)"
    commands:
      - pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "(Connect manually|Manuell verbinden)"
    timeout: 10000
- tapOn: "(Host or IP address|Host oder IP-Adresse).*"
- eraseText: 64
- inputText: "${CORE_HOST}"
# The Fire OS keyboard opens over the form while typing; close it before moving on with the remote.
- hideKeyboard
- takeScreenshot: build/device-artifacts/p5-02-manual-entry
# Host field -> Port field -> "Test connection" button.
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Center
# A successful test saves the address, closes this screen and connects at once, so the result line is only visible for an
# instant: wait for Now Playing of the test zone instead (the app has the zone saved).
- extendedWaitUntil:
    visible: "${ROON_TEST_ZONE} ·.*"
    timeout: 60000
- takeScreenshot: build/device-artifacts/p5-03-manual-connected
