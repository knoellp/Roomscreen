# Zones button: any key shows the bar (focus on play/pause), four Left presses reach Zones (previous, Lyrics, Settings, Zones; the Lyrics
# button exists with LRCLIB on, scripts/maestro-regression.sh sets that first), Select opens the zone list, Back returns to the same zone.
# Run with the zone name from the environment: maestro test -e ROON_TEST_ZONE="$ROON_TEST_ZONE" maestro/phase1-zones.yaml
appId: io.github.knoellp.roomscreen
---
- launchApp
- extendedWaitUntil:
    visible: "${ROON_TEST_ZONE} ·.*"
    timeout: 60000
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible: "(Zones|Zonen)"
    timeout: 5000
- repeat:
    times: 4
    commands:
      - pressKey: Remote Dpad Left
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "(Select zone|Zone wählen)"
    timeout: 10000
- pressKey: Back
- extendedWaitUntil:
    visible: "${ROON_TEST_ZONE} ·.*"
    timeout: 10000
