# Volume panel (docs/SPEC.md section 6.1), German UI, zone "Büro" selected and connected. Driven in steps by scripts/f4-volume.sh:
# the script reads DUMP_STATE (volume, volume_panel) and `roon-cli zones` after each step.
# Timing on the stick: the control bar hides 5 s after the last key and the panel closes 8 s after the last key, while a
# Maestro takeScreenshot takes more than 5 s. So every step opens the panel itself (Up, Right, Right, Center) with no
# screenshot or wait between the keys, and the panel checks are Maestro assertions right after the keys.
# STEP=open   : open; the panel row "Büro" is visible and the bar is hidden (checked here: by the time the script reads
#               DUMP_STATE after the flow, the 8 s may be over).
# STEP=up3    : open, Right x3 (three clicks of one step each); the row shows the start value + 3 (VALUE).
# STEP=down3  : open, Left x3; the row shows the start value (VALUE).
# STEP=back   : open, Back; the panel is gone and the app stays on Now Playing.
# Screenshots go to build/device-artifacts/p7-*.png.
appId: io.github.knoellp.roomscreen
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Büro · .*"
    timeout: 30000
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible: "Einstellungen"
    timeout: 5000
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    notVisible: "Einstellungen"
    timeout: 5000
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - assertVisible: "Büro"
      - assertNotVisible: "Einstellungen"
      - takeScreenshot: build/device-artifacts/p7-01-panel-open
- runFlow:
    when:
      true: ${STEP == 'up3'}
    commands:
      - pressKey: Remote Dpad Right
      - pressKey: Remote Dpad Right
      - pressKey: Remote Dpad Right
      - assertVisible: ${VALUE}
      - takeScreenshot: build/device-artifacts/p7-03-after-right-3
- runFlow:
    when:
      true: ${STEP == 'down3'}
    commands:
      - pressKey: Remote Dpad Left
      - pressKey: Remote Dpad Left
      - pressKey: Remote Dpad Left
      - assertVisible: ${VALUE}
      - takeScreenshot: build/device-artifacts/p7-04-after-left-3
- runFlow:
    when:
      true: ${STEP == 'back'}
    commands:
      - pressKey: Back
      - assertVisible: "Büro · .*"
      - assertNotVisible: "Einstellungen"
      - takeScreenshot: build/device-artifacts/p7-05-after-back
