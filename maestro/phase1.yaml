# Phase 1 device flow: make sure zone "Büro" is selected via the D-pad and now playing is shown.
# Zones are sorted with German collation: Bad, Büro, Fernseher, Kamin, ...
# Selecting a zone only stores the choice; nothing is sent to Roon.
appId: io.github.knoellp.roomscreen
---
- launchApp
- extendedWaitUntil:
    visible: "(Büro ·.*|Select zone|Zone wählen)"
    timeout: 60000
# First start (no saved zone): the list opens directly.
- runFlow:
    when:
      visible: "(Select zone|Zone wählen)"
    commands:
      - pressKey: Remote Dpad Down
      - pressKey: Remote Dpad Down
      - pressKey: Remote Dpad Center
# A zone is already saved: open the list through the Zones button. The first key shows the bar with the focus on play/pause (a Center
# there would pause or start Büro), so go left to Zones: previous, Lyrics, Settings, Zones (the Lyrics button exists with LRCLIB on,
# which scripts/maestro-regression.sh sets first).
- runFlow:
    when:
      notVisible: "(Select zone|Zone wählen)"
    commands:
      - pressKey: Remote Dpad Up
      - extendedWaitUntil:
          visible: "(Zones|Zonen)"
          timeout: 5000
      - repeat:
          times: 4
          commands:
            - pressKey: Remote Dpad Left
      - pressKey: Remote Dpad Center
      - extendedWaitUntil:
          visible: "(Select zone|Zone wählen)"
          timeout: 10000
      - pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "Büro ·.*"
    timeout: 15000
